# Mono-accent prompt: one accent color fading into neutral grays.
# Switch the whole look by changing `palette` below to one of:
#   moonfly_arrow_git (green ❯ + green branch) | moonfly_arrow_git_darker (same, darker blocks)
#   moonfly (all gray)
#   moonfly_arrow (green ❯) | moonfly_git (green branch name)
#   moonfly_green (green first block) | moonfly_blue | vesper | carbonfox | github_dark | mono | tokyo_night | gruvbox | kanagawa | nord
# Pick the one that matches your kitty / Neovim / GTK theme.
"$schema" = 'https://starship.rs/config-schema.json'
scan_timeout = 100
command_timeout = 1000

format = """
[](s1)\
$os\
$username\
[](bg:s2 fg:s1)\
$directory\
[](bg:s3 fg:s2)\
$git_branch\
$git_status\
[](fg:s3 bg:s4)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:s4 bg:s5)\
$time\
[ ](fg:s5)\
$cmd_duration\
$line_break\
$character"""

palette = 'moonfly_arrow_git'

[os]
disabled = false
style = "bg:s1 fg:on_accent"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:s1 fg:on_accent"
style_root = "bg:s1 fg:on_accent"
format = '[ $user]($style)'

[directory]
style = "bg:s2 fg:text"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:s3"
format = '[[ $symbol $branch ](fg:branch bg:s3)]($style)'

[git_status]
style = "bg:s3"
format = '[[($all_status$ahead_behind )](fg:text bg:s3)]($style)'

[nodejs]
symbol = ""
style = "bg:s4"
format = '[[ $symbol( $version) ](fg:text bg:s4)]($style)'

[c]
symbol = " "
style = "bg:s4"
format = '[[ $symbol( $version) ](fg:text bg:s4)]($style)'

[rust]
symbol = ""
style = "bg:s4"
format = '[[ $symbol( $version) ](fg:text bg:s4)]($style)'

[golang]
symbol = ""
style = "bg:s4"
format = '[[ $symbol( $version) ](fg:text bg:s4)]($style)'

[php]
symbol = ""
style = "bg:s4"
format = '[[ $symbol( $version) ](fg:text bg:s4)]($style)'

[java]
symbol = " "
style = "bg:s4"
format = '[[ $symbol( $version) ](fg:text bg:s4)]($style)'

[kotlin]
symbol = ""
style = "bg:s4"
format = '[[ $symbol( $version) ](fg:text bg:s4)]($style)'

[haskell]
symbol = ""
style = "bg:s4"
format = '[[ $symbol( $version) ](fg:text bg:s4)]($style)'

[python]
symbol = ""
style = "bg:s4"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:text bg:s4)]($style)'

[docker_context]
symbol = ""
style = "bg:s4"
format = '[[ $symbol( $context) ](fg:text bg:s4)]($style)'

[conda]
symbol = "  "
style = "fg:text bg:s4"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:s5"
format = '[[  $time ](fg:text bg:s5)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:ok)'
error_symbol = '[❯](bold fg:err)'
vimcmd_symbol = '[❮](bold fg:ok)'
vimcmd_replace_one_symbol = '[❮](bold fg:s1)'
vimcmd_replace_symbol = '[❮](bold fg:s1)'
vimcmd_visual_symbol = '[❮](bold fg:s1)'

[cmd_duration]
show_milliseconds = false
format = "in $duration "
style = "bg:s5"
disabled = false
show_notifications = true
min_time_to_notify = 45000

