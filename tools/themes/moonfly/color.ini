window_padding_width  20

# vim:ft=kitty
## name:     Moonfly (Auto-Kitty variant)
## based on: https://github.com/bluz71/vim-moonfly-colors
## Text colors are stock Moonfly. Borders and tabs are recolored to
## black/white/gray so there's no blue outline or colored tabs.

# Basic colors
background            #080808
foreground            #bdbdbd
selection_background  #b2ceee
selection_foreground  #080808
cursor                #9e9e9e
cursor_text_color     #080808
url_color             #79dac8

# Split borders (Ctrl+Shift+Enter, F5, F6)
# active = the split you're typing in, inactive = the others
active_border_color   #9e9e9e
inactive_border_color #262626
bell_border_color     #e3c78a

# Tab bar (Ctrl+Shift+T)
tab_bar_background      #080808
active_tab_background   #c6c6c6
active_tab_foreground   #080808
inactive_tab_background #1c1c1c
inactive_tab_foreground #808080

# The 16 terminal colors (stock Moonfly)
color0  #323437
color8  #949494
color1  #ff5d5d
color9  #ff5189
color2  #8cc85f
color10 #36c692
color3  #e3c78a
color11 #c6c684
color4  #80a0ff
color12 #74b2ff
color5  #cf87e8
color13 #ae81ff
color6  #79dac8
color14 #85dc85
color7  #c6c6c6
color15 #e4e4e4
tab_bar_margin_color    #080808

# Dim the text in splits you're not typing in, so the active one is obvious
# even with 5-8 terminals open. 1.0 = no dimming.
inactive_text_alpha 0.75
